name: Update WakaTime

on:
  schedule:
    - cron: "0 6 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch WakaTime stats
        run: |
          curl https://wakatime.com/api/v1/users/WilkDev/stats \
          -o assets/data/wakatime.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add assets/data/wakatime.json
          git commit -m "update wakatime stats" || exit 0
          git push