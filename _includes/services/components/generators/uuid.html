<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold">{{page.MAIN.title}}</h1>
        <p class="lead text-secondary mb-0">{{page.MAIN.description}}</p>
    </header>
    <div class="row g-3 align-items-end mb-4">
        <div class="row">
            <label for="quantity" class="fw-semibold">
                {{page.INFO.number_of}}
            </label>
            <div class="col-md-6">
                <input type="number" id="quantity" class="form-control" value="10" min="1" max="500">
                <small class="text-muted">{{page.INFO.description}}</small>
            </div>
            <div class="col-md-6">
                <button class="btn btn-primary w-100" onclick="generateUUIDs()">
                    {{page.INFO.btn}}
                </button>
            </div>
        </div>
    </div>
    <section class="results-section">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-semibold">
                {{page.MAIN.results}}
                <span id="total" class="badge bg-secondary">0</span>
            </span>
            <button class="btn btn-success btn-sm" onclick="copyAll()" id="copyAllBtn" disabled>
                {{page.MAIN.coppy_all}}
            </button>
        </div>

        <div id="uuidList"></div>
    </section>
</div>
<script type="module" src="{{ site.baseurl }}/assets/scripts/services/uuid-generator.js"></script>
