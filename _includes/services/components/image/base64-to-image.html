<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-5 fw-bold">Base64 Image Encoder</h1>
        <p class="lead text-secondary mb-0">
            Convert images to Base64 directly in your browser.
            Nothing is uploaded to a server.
        </p>
    </header>
    <!-- Upload Area -->
    <section id="dropZone"
        class="border border-2 border-secondary border-dashed rounded-4 bg-white bg-opacity-50 p-5 text-center mb-5">
        <div class="mb-3">
            <strong class="fs-4">Drop images here</strong>
        </div>
        <p>or</p>
        <button type="button" id="browseButton" class="btn btn-primary px-4">Browse files</button>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
        <!-- TODO MAKE IT NICER -->
        <!-- <div class="text-secondary small mt-4">JPEG · PNG · WebP · GIF · SVG · BMP · ICO · TIFF · AVIF · HEIC<br>Up to
            30 files · 5 MB each</div> -->
        <div class="mt-4">
            <div class="d-flex flex-wrap justify-content-center gap-2 mb-3"> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-filetype-jpg me-1"></i>JPEG </span> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-filetype-png me-1"></i>PNG </span> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-filetype-webp me-1"></i>WebP </span> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-filetype-gif me-1"></i>GIF </span> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-filetype-svg me-1"></i>SVG </span> <span
                    class="badge bg-light text-dark border"> <i class="bi bi-file-earmark-image me-1"></i>BMP </span>
                <span class="badge bg-light text-dark border"> <i class="bi bi-file-earmark-image me-1"></i>ICO </span>
                <span class="badge bg-light text-dark border"> <i class="bi bi-file-earmark-image me-1"></i>TIFF </span>
                <span class="badge bg-light text-dark border"> <i class="bi bi-file-earmark-image me-1"></i>AVIF </span>
                <span class="badge bg-light text-dark border"> <i class="bi bi-file-earmark-image me-1"></i>HEIC </span>
            </div>
            <div class="small d-flex justify-content-center align-items-center gap-3">
                <span> <i class="bi bi-images me-1"></i> Up to <strong>30 files</strong> </span>
                <span>•</span>
                <span> <i class="bi bi-hdd me-1"></i><strong>5 MB</strong> each</span>
            </div>
        </div>
    </section>
    <!-- Results -->
    <section class="results-section">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-3">
            <h2 class="h4 mb-0">Encoding Results</h2>
            <span id="fileCount" class="text-secondary small">No files converted yet</span>
        </div>
        <div id="results">
            <div class="alert alert-light border text-secondary mb-0 empty">+
                Add an image to see its Base64 encoding here.
            </div>
        </div>
    </section>
</div>
<script type="module" src="{{ site.baseurl }}/assets/scripts/services/image-base64-script.js"></script>
