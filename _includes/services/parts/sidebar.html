<nav class="d-flex flex-column flex-shrink-0 sidebar border-end">
    <div class="row g-2 p-1">
        <div class="col-4">
            <a class="d-flex justify-content-center align-items-center text-decoration-none nav-link border"
                href="{{ site.baseurl }}/{{page.lang}}/">
                <i class="bi bi-house-fill sidebar-home-icon"></i>
            </a>
        </div>
        <div class="col-8">
            <a class="d-flex justify-content-center align-items-center text-decoration-none nav-link border"
                href="{{ site.baseurl }}/{{page.lang}}/services">
                <i class="bi bi-wrench-adjustable-circle sidebar-home-icon"></i>
            </a>
        </div>
    </div>
    <hr class="text-secondary">
    <ul class="nav nav-pills flex-column mb-auto gap-1 p-1">
        <li class="nav-item">
            <a href="{{ site.baseurl }}/{{page.lang}}/services" class="nav-link border btn text-body">

                <i class="bi bi-wrench-adjustable-circle"></i>
                Services
            </a>
        </li>
        {% assign image_index = false %}
        {% if page.url contains '/services/image'%}
        {% assign image_index = true %}
        {% endif %}
        <li class="nav-item w-100">
            <a href="{{ site.baseurl }}/{{ page.lang }}/services/image"
                class="nav-link border btn text-body {% if page.url contains '/services/image' %}active{% endif %}">
                <i class="bi bi-image"></i>
                Image
            </a>
            {% if image_index %}
            <ul class="nav flex-column ms-3 mt-1 gap-1">
                <li class="nav-item">
                    <a href="{{ site.baseurl }}/{{ page.lang }}/services/image/image-to-base64"
                        class="nav-link border btn text-body {% if page.url contains '/services/image/image-to-base64' %}active{% endif %}">
                        Image to Base64
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ site.baseurl }}/{{ page.lang }}/services/image/base64-image"
                        class="nav-link border btn text-body {% if page.url contains '/services/base64-image' %}active{% endif %} disabled">
                        Base64 to Image
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ site.baseurl }}/{{ page.lang }}/services/image/camera"
                        class="nav-link border btn text-body {% if page.url contains '/services/base64-image' %}active{% endif %} disabled">
                        Camera
                    </a>
                </li>
            </ul>
            {% endif %}
        </li>
    </ul>
    <hr class="text-secondary">
    <div class="d-flex justify-content-center controls-margin">
        <a href="{{site.github}}" class="btn btn-outline-secondary btn-sm" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-github"></i>
        </a>
        <button class="btn btn-outline-secondary btn-sm theme-switch">
            <i class="bi bi-moon-fill moon-icon"></i>
            <i class="bi bi-sun-fill sun-icon"></i>
        </button>
        <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="dropdown">
                {% if page.lang == 'pl' %}
                <img src="https://flagcdn.com/w20/pl.png" class="lang-flag">
                {% else %}
                <img src="https://flagcdn.com/w20/gb.png" class="lang-flag">
                {% endif %}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item lang-switch" data-lang="en"
                        href="{{ site.baseurl }}/en{{ page.url | remove_first: '/pl' | remove_first: '/en' }}">
                        <img src="https://flagcdn.com/w20/gb.png" class="lang-flag" alt="EN">
                    </a>
                </li>
                <li>
                    <a class="dropdown-item lang-switch" data-lang="pl"
                        href="{{ site.baseurl }}/pl{{ page.url | remove_first: '/pl' | remove_first: '/en' }}">
                        <img src="https://flagcdn.com/w20/pl.png" class="lang-flag">
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<link rel="stylesheet" href="{{ site.baseurl }}/assets/styles/services/sidebar-style.css">
